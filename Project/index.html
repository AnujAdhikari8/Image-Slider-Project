
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider Using JavaScript</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container">

        <div class="slider-track">
            <img src="Image/Mountain landscape.jpg" alt="Mountain landscape">
            <img src="Image/nature.jpg" alt="Nature landscape">
            <img src="Image/Dog portrait.jpg " alt="Dog portrait">
            <img src="Image/Mountain scenery.jpg" alt="Mountain scenery">
        </div>

        <button class="prev-btn" aria-label="Previous image">&#10094;</button>
        <button class="next-btn" aria-label="Next image">&#10095;</button>

        <div class="slider-dots"></div>

    </div>

    <script src="slider.js"></script>
</body>
</html>
